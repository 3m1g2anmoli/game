<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星际收集者｜接金币小游戏</title>
  <style>
    :root{--bg:#090d1f;--panel:#121936;--cyan:#4de7ff;--pink:#ff5fcf;--gold:#ffd166;--text:#eef3ff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#24356c 0,#090d1f 52%);color:var(--text);font-family:Inter,"Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:18px}
    .app{width:min(980px,100%)} header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),#7867ff);display:grid;place-items:center;font-size:25px;box-shadow:0 0 30px #4de7ff55}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}.title{font-size:24px;font-weight:800;margin-top:3px}.hint{color:#aeb8d8;font-size:13px}
    .stats{display:flex;gap:10px}.stat{background:#ffffff0d;border:1px solid #ffffff16;border-radius:14px;padding:9px 14px;min-width:80px}.stat small{display:block;color:#9da8cb;font-size:11px}.stat b{font-size:20px}
    .game-shell{background:#ffffff08;border:1px solid #ffffff18;border-radius:25px;padding:14px;box-shadow:0 25px 80px #0008}.canvas-wrap{position:relative;overflow:hidden;border-radius:17px;background:#070a19}.canvas-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#ffffff03 50%);background-size:100% 5px;mix-blend-mode:screen}.game{display:block;width:100%;height:auto;aspect-ratio:16/9;cursor:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#070a19aa;backdrop-filter:blur(5px)}.card{text-align:center;padding:28px;max-width:360px}.card h1{margin:0 0 8px;font-size:34px}.card p{color:#b4bdd8;line-height:1.7;margin:8px 0 20px}.btn{border:0;border-radius:13px;padding:13px 26px;background:linear-gradient(100deg,var(--cyan),#7f7cff);color:#07101d;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 25px #4de7ff33}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.hidden{display:none!important}
    .bottom{display:flex;justify-content:space-between;align-items:center;padding:14px 5px 0;color:#9da8cb;font-size:13px}.keys{display:flex;gap:7px;align-items:center}.key{border:1px solid #ffffff25;background:#ffffff0c;padding:5px 8px;border-radius:6px;color:#dce4ff}.mobile-controls{display:none;gap:18px;justify-content:center;margin-top:14px}.control{width:62px;height:46px;border:1px solid #ffffff24;border-radius:12px;background:#ffffff0d;color:white;font-size:20px}
    @media(max-width:650px){header{display:block}.stats{margin-top:14px}.stat{flex:1}.game-shell{padding:8px}.bottom{display:block;text-align:center;line-height:2}.keys{justify-content:center}.mobile-controls{display:flex}.hint{margin-top:5px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="logo">✦</div><div><div class="eyebrow">ARCADE · 01</div><div class="title">星际收集者</div><div class="hint">接住能量金币，躲开陨石，挑战最高分</div></div></div><div class="stats"><div class="stat"><small>得分</small><b id="score">0</b></div><div class="stat"><small>生命</small><b id="lives">❤❤❤</b></div><div class="stat"><small>最高分</small><b id="best">0</b></div></div></header>
  <section class="game-shell"><div class="canvas-wrap"><canvas id="game" class="game" width="960" height="540"></canvas><div id="overlay" class="overlay"><div class="card"><div style="font-size:48px">🚀</div><h1 id="overlayTitle">准备起飞？</h1><p id="overlayText">左右移动飞船接住金币。接到金币得分，撞到陨石会失去生命。</p><button id="start" class="btn">开始游戏</button></div></div></div><div class="mobile-controls"><button class="control" data-dir="-1">←</button><button class="control" data-dir="1">→</button></div><div class="bottom"><div>金币 +10　陨石 -1❤　速度随分数提升</div><div class="keys"><span class="key">←</span><span class="key">→</span> 移动　<span class="key">P</span> 暂停　<span class="key">空格</span> 开始</div></div></section>
</main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height; let running=false,paused=false,score=0,lives=3,best=+localStorage.starBest||0,last=0,spawn=0,items=[],stars=[]; const ship={x:W/2,y:H-65,w:78,h:28,speed:520};
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,a:Math.random()*.7+.2});
const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),title=document.querySelector('#overlayTitle'),text=document.querySelector('#overlayText'); bestEl.textContent=best;
function reset(){score=0;lives=3;items=[];ship.x=W/2;updateHud()}; function updateHud(){scoreEl.textContent=score;livesEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);bestEl.textContent=best}
function item(){let coin=Math.random()<.72; items.push({type:coin?'coin':'rock',x:35+Math.random()*(W-70),y:-30,r:coin?15:20,vy:150+Math.random()*100+score*1.5,rot:0})}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111a46');g.addColorStop(1,'#080a18');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=s.a;x.fillStyle='#d9f4ff';x.beginPath();x.arc(s.x,(s.y+(running?performance.now()/1000*18:0))%H,s.r,0,7);x.fill()});x.globalAlpha=1;
 items.forEach(o=>{x.save();x.translate(o.x,o.y);x.rotate(o.rot);if(o.type==='coin'){x.shadowBlur=22;x.shadowColor='#ffd166';x.fillStyle='#ffd166';x.beginPath();x.arc(0,0,o.r,0,7);x.fill();x.fillStyle='#fff1a8';x.font='bold 15px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('$',0,1)}else{ x.shadowBlur=14;x.shadowColor='#ff5f7a';x.fillStyle='#df5277';x.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=o.r*(i%2?.75:1);x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.fillStyle='#ffb0b8';x.beginPath();x.arc(-5,-5,3,0,7);x.fill()}x.restore()});
 x.save();x.translate(ship.x,ship.y);x.shadowBlur=25;x.shadowColor='#4de7ff';x.fillStyle='#4de7ff';x.beginPath();x.moveTo(-ship.w/2,12);x.lineTo(-ship.w/2+14,-10);x.lineTo(0,-21);x.lineTo(ship.w/2-14,-10);x.lineTo(ship.w/2,12);x.closePath();x.fill();x.fillStyle='#101936';x.beginPath();x.arc(0,-8,8,0,7);x.fill();x.fillStyle='#ff5fcf';x.fillRect(-23,10,13,5);x.fillRect(10,10,13,5);x.restore();}
function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;if(running&&!paused){spawn+=dt;if(spawn>Math.max(.28, .8-score/600)){spawn=0;item()} if(keys.left)ship.x-=ship.speed*dt;if(keys.right)ship.x+=ship.speed*dt;ship.x=Math.max(45,Math.min(W-45,ship.x));items.forEach(o=>{o.y+=o.vy*dt;o.rot+=dt*2});for(let i=items.length-1;i>=0;i--){let o=items[i];if(Math.abs(o.x-ship.x)<o.r+35&&Math.abs(o.y-ship.y)<o.r+20){if(o.type==='coin'){score+=10;if(score>best){best=score;localStorage.starBest=best}}else{lives--;if(lives<=0){running=false;title.textContent='任务结束';text.textContent='本次得分 '+score+'，继续练习就能突破最高分！';document.querySelector('#start').textContent='再来一次';overlay.classList.remove('hidden')}}items.splice(i,1);updateHud()}else if(o.y>H+40)items.splice(i,1)}}draw();requestAnimationFrame(loop)}
const keys={left:false,right:false}; addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key.toLowerCase()==='p'&&running)paused=!paused;if(e.code==='Space'&&!running)startGame()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});document.querySelectorAll('.control').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.dir==='-1'?'left':'right']=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.dir==='-1'?'left':'right']=false});function startGame(){reset();running=true;paused=false;overlay.classList.add('hidden');document.querySelector('#start').textContent='开始游戏'}document.querySelector('#start').onclick=startGame;requestAnimationFrame(loop);
</script>
</body></html>
